[build-system]
requires = ["setuptools<70.0.0", "wheel", "packaging>=23.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remoroo"
version = "0.15.20"
description = "Remoroo Offline Engine CLI"
requires-python = ">=3.10"
dependencies = [
    "packaging>=23.0",
    "textual>=0.80.0",
    "typer>=0.9.0",
    "jsonschema>=4.22.0",
    "requests>=2.31.0",
    "remoroo-core>=0.1.1",
    "sseclient-py",
    "prompt_toolkit>=3.0.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-language-pack>=0.13.0",
    "pexpect>=4.9.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
remoroo = "remoroo.cli:app"

[tool.setuptools.packages.find]
include = ["remoroo*", "remoroo_offline*"]

[tool.setuptools.package-data]
remoroo = [
    "engine/Dockerfile",
    # Seeds are NOT packaged — they are Remoroo methodology (IP), served from the
    # brain at runtime via the read_seed tool (see remoroo_brain/seeds/). The CLI
    # ships zero seeds; the boundary test enforces this.
    # Prebuilt Remoroo Studio (minified dist + Python servers) — populated by
    # remoroo_studio/scripts/bundle_studio.py in CI before the wheel is built.
    "_studio/*.py",
    "_studio/**/*",
]
